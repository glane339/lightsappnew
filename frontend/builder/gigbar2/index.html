<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GigBAR 2 — Builder</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page">
  <p id="missing" class="banner error" hidden></p>
  <div class="split">
    <section class="panel">
      <h2>Presets</h2>
      <div id="library" class="item-list"></div>
      <div class="actions"><button type="button" id="new-btn">New</button></div>
    </section>
    <section class="panel">
      <div id="banner" class="banner"></div>
      <form id="form">
        <label class="field">Id
          <input id="preset-id" name="id" placeholder="gigbar-red-wash" autocomplete="off">
        </label>
        <div id="fixture"></div>
        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
        </div>
      </form>
    </section>
  </div>
</main>
<script>
window.DEVICE_PAGE = {
  model: "chauvet_gigbar_2",
  mode: "23CH",
  profileGlobal: "CHAUVET_GIGBAR_2",
  nav: "gigbar2",
  missingHint: "GigBAR 2 not in patch."
};
</script>
<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/fixtures/chauvet_gigbar_2.js"></script>
<script src="/js/fixture-editor.js"></script>
<script src="/js/pages/device-preset.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keobin — Builder</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page">
  <p id="missing" class="banner error" hidden></p>
  <div class="split">
    <section class="panel">
      <h2>Device presets</h2>
      <div id="library" class="item-list"></div>
      <div class="actions"><button type="button" id="new-btn">New</button></div>
    </section>
    <section class="panel">
      <div id="banner" class="banner"></div>
      <form id="form">
        <label class="field">Id slug
          <input id="preset-id" name="id" placeholder="keobin-red" autocomplete="off">
        </label>
        <p class="help">Named looks from the previous app. Channel 1 stays Not used unless you pick a self-run or sound program. Magic ball is multi-select.</p>
        <div id="fixture"></div>
        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
        </div>
      </form>
    </section>
  </div>
</main>
<script>
window.DEVICE_PAGE = {
  model: "keobin_light_bar",
  mode: "18CH",
  profileGlobal: "KEOBIN_LIGHT_BAR",
  nav: "keobin",
  missingHint: "No Keobin Light Bar is in the patch. Run backend/seed_devices.py."
};
</script>
<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/fixtures/keobin_light_bar.js"></script>
<script src="/js/fixture-editor.js"></script>
<script src="/js/pages/device-preset.js"></script>
</body>
</html>

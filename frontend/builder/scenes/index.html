<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenes — Builder</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page">
  <div class="split">
    <section class="panel">
      <h2>Scenes</h2>
      <div id="library" class="item-list"></div>
      <div class="actions"><button type="button" id="new-btn">New</button></div>
    </section>
    <section class="panel">
      <div id="banner" class="banner"></div>
      <form id="form">
        <label class="field">Id
          <input id="scene-id" name="id" placeholder="red-wash" autocomplete="off">
        </label>
        <label class="field">DMX
          <select id="dmx-list" required></select>
        </label>
        <label class="field">WLED
          <select id="wled-list" required></select>
        </label>
        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
        </div>
      </form>
    </section>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/pages/scenes.js"></script>
</body>
</html>

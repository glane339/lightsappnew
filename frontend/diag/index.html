<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostics — Lights</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page">
  <div class="diag-grid">
    <section class="panel">
      <h2>Scenes</h2>
      <div id="scenes" class="scenes"><span class="empty">loading…</span></div>
      <div class="transport">
        <button type="button" id="beat">Beat (space)</button>
        <button type="button" id="deactivate">Deactivate</button>
        <button type="button" id="blackout" class="danger">Blackout</button>
        <button type="button" id="reload">Reload</button>
      </div>
      <div id="log" class="log"></div>
    </section>
    <section class="panel">
      <h2>Scene selection → sender</h2>
      <div id="last" class="big">— µs</div>
      <dl>
        <dt>state</dt><dd id="state">unknown</dd>
        <dt>samples</dt><dd id="count">0</dd>
        <dt>p50</dt><dd id="p50">—</dd>
        <dt>p99</dt><dd id="p99">—</dd>
        <dt>sender</dt><dd id="sender">—</dd>
        <dt>frames</dt><dd id="frames">—</dd>
        <dt>LEDfx</dt><dd id="ledfx">—</dd>
      </dl>
      <div class="note">
        Budget is 13 000 µs (13 ms) at p99, measured from scene selection to the
        sender returning — not browser click, network, or fixture time.
      </div>
    </section>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/show.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/pages/diag.js"></script>
</body>
</html>
